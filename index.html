<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>HBD love</title>     
    <link type="text/css" rel="stylesheet" href="file/default.css">
    <script type="text/javascript" src="file/jquery.min.js"></script>
    <script type="text/javascript" src="file/jscex.min.js"></script>
    <script type="text/javascript" src="file/jscex-parser.js"></script>
    <script type="text/javascript" src="file/jscex-jit.js"></script>
    <script type="text/javascript" src="file/jscex-builderbase.min.js"></script>
    <script type="text/javascript" src="file/jscex-async.min.js"></script>
    <script type="text/javascript" src="file/jscex-async-powerpack.min.js"></script>
    <script type="text/javascript" src="file/function.js" charset="utf-8"></script>
    <script type="text/javascript" src="file/love.js" charset="utf-8"></script>
    <style>
        body {
            background-color: #000000 !important;
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #main {
            background-color: #000000 !important;
        }
        #wrap {
            background-color: #000000 !important;
        }
        #code {
            color: #ffffff !important;
        }
        .say {
            color: #ffffff !important;
        }
    </style>
    <script>
        function playAudio() {
            var audio = document.getElementById("myAudio");
            if(audio) audio.play();
        }
    </script>
</head>
<body>
    <div id="main">
        <div id="error"><a href="http://www.google.cn/chrome/intl/zh-CN/landing_chrome.html?hl=zh-CN&brand=CHMI">Chrome</a> (<a href="http://firefox.com.cn/download/">Firefox</a>)</div>
        <audio autoplay="autoplay" height="100" width="100" id="myAudio">
            <source src="aud.mp3" type="audio/mp3" />
            <embed height="100" width="100" src="aud.mp3" />
        </audio>
        <div id="wrap">
            <div id="text">
                <div id="code">
                    <span class="say">Hey you 💞</span><br>
                    <span class="say">Happy Birthday 🎈</span><br>
                    <span class="say">May God bless you 🍀</span><br>
                    <span class="say">And give u many happiness 💕</span><br>
                    <span class="say">Just saying... you're pretty awesome ❤️</span><br>
                    <span class="say">Sending good vibes and maybe a wink 😏</span><br>
                    <span class="say">Hope u have a great day today ❤️😘</span><br>
                </div>
            </div>
            <div id="clock-box" style="color: #ffffff;">
                <span id="clock">577 days 0 hours 0 minutes 0 seconds</span>
            </div>
            <canvas id="canvas" width="1100" height="680"></canvas>
        </div>
    </div>

    <script>
    (function() {
        var canvas = $('#canvas');
        
        if (!canvas[0].getContext) {
            $("#error").show();
            return false;
        }

        var width = canvas.width();
        var height = canvas.height();        
        canvas.attr("width", width);
        canvas.attr("height", height);

        var opts = {
            seed: {
                x: width / 2 - 20,
                color: "rgb(255, 105, 180)",
                scale: 2
            },
            branch: [
                [535, 680, 570, 250, 500, 200, 30, 100, [
                    [540, 500, 455, 417, 340, 400, 13, 100, [
                        [450, 435, 434, 430, 394, 395, 2, 40]
                    ]],
                    [550, 445, 600, 356, 680, 345, 12, 100, [
                        [578, 400, 648, 409, 661, 426, 3, 80]
                    ]],
                    [539, 281, 537, 248, 534, 217, 3, 40],
                    [546, 397, 413, 247, 328, 244, 9, 80, [
                        [427, 286, 383, 253, 371, 205, 2, 40],
                        [498, 345, 435, 315, 395, 330, 4, 60]
                    ]],
                    [546, 357, 608, 252, 678, 221, 6, 100, [
                        [590, 293, 646, 277, 648, 271, 2, 80]
                    ]]
                ]] 
            ],
            bloom: {
                num: 700,
                width: 1080,
                height: 650,
            },
            footer: {
                width: 1200,
                height: 5,
                speed: 10,
            }
        }

        var tree = new Tree(canvas[0], width, height, opts);
        var seed = tree.seed;
        var foot = tree.footer;
        var hold = 1;

        canvas.click(function(e) {
            playAudio();
            var offset = canvas.offset(), x, y;
            x = e.pageX - offset.left;
            y = e.pageY - offset.top;
            if (seed.hover(x, y)) {
                hold = 0; 
                canvas.unbind("click");
                canvas.unbind("mousemove");
                canvas.removeClass('hand');
            }
        }).mousemove(function(e) {
            var offset = canvas.offset(), x, y;
            x = e.pageX - offset.left;
            y = e.pageY - offset.top;
            canvas.toggleClass('hand', seed.hover(x, y));
        });

        var seedAnimate = eval(Jscex.compile("async", function () {
            seed.draw();
            while (hold) {
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canScale()) {
                seed.scale(0.95);
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canMove()) {
                seed.move(0, 2);
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
        }));

        var growAnimate = eval(Jscex.compile("async", function () {
            var isFirstStep = true;
            do {
                // গাছ গজানোর প্রথম ফ্রেমেই ফুটারের তৈরি করা ক্যানভাস ক্লিয়ার করে মাটির দাগটা পুনরায় ফ্রেশ ড্র করে দেওয়া হচ্ছে
                if (isFirstStep) {
                    tree.ctx.clearRect(0, 0, width, height);
                    foot.draw();
                    isFirstStep = false;
                }
                tree.grow();
                $await(Jscex.Async.sleep(10));
            } while (tree.canGrow());
        }));

        var flowAnimate = eval(Jscex.compile("async", function () {
            do {
                tree.flower(2);
                $await(Jscex.Async.sleep(10));
            } while (tree.canFlower());
        }));

        var moveAnimate = eval(Jscex.compile("async", function () {
            tree.snapshot("p1", 240, 0, 610, 680);
            while (tree.move("p1", 500, 0)) {
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
            foot.draw();
            tree.snapshot("p2", 500, 0, 610, 680);

            canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
            canvas.css("background", "#000");
            $await(Jscex.Async.sleep(300));
            canvas.css("background", "none");
        }));

        // ন্যাচারাল বাতাসের লজিক সহ হার্ট রেন্ডারিং
        var fallenHearts = [];
        var fallingHearts = [];

        function drawHeartShape(ctx, x, y, size, color, angle) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.fillStyle = color;
            var h = size * 0.3;
            ctx.moveTo(0, h);
            ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, h);
            ctx.bezierCurveTo(-size / 2, (size + h) / 2, 0, size, 0, size);
            ctx.bezierCurveTo(0, size, size / 2, (size + h) / 2, size / 2, h);
            ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, h);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function initFallingHearts() {
            var colors = ["#ff4d6d", "#ff758f", "#ffb3c1", "#f72585", "#ffb703", "#e63946", "#ff85a1"];
            for (var i = 0; i < 80; i++) {
                fallingHearts.push({
                    x: Math.random() * 450 + 500,
                    y: Math.random() * 260 + 100,
                    size: Math.random() * 6 + 5,
                    speedY: Math.random() * 0.9 + 0.4,
                    speedX: (Math.random() - 0.5) * 0.8,
                    swingSpeed: Math.random() * 0.05 + 0.02,
                    swingOffset: Math.random() * Math.PI * 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    angle: Math.random() * Math.PI,
                    rotSpeed: (Math.random() - 0.5) * 0.04
                });
            }
        }

        function updateAndDrawHearts() {
            var ctx = tree.ctx;

            for (var i = 0; i < fallenHearts.length; i++) {
                var fh = fallenHearts[i];
                drawHeartShape(ctx, fh.x, fh.y, fh.size, fh.color, fh.angle);
            }

            for (var j = 0; j < fallingHearts.length; j++) {
                var h = fallingHearts[j];
                drawHeartShape(ctx, h.x, h.y, h.size, h.color, h.angle);

                h.y += h.speedY;
                h.x += Math.sin(h.y * h.swingSpeed + h.swingOffset) * 0.9 + h.speedX;
                h.angle += h.rotSpeed;

                if (h.y >= height - 20) {
                    if (fallenHearts.length < 140) {
                        fallenHearts.push({
                            x: h.x,
                            y: height - 16 - (Math.random() * 10),
                            size: h.size,
                            color: h.color,
                            angle: h.angle
                        });
                    }
                    h.x = Math.random() * 450 + 500;
                    h.y = Math.random() * 180 + 100;
                }
            }
        }

        var customJumpAnimate = eval(Jscex.compile("async", function () {
            initFallingHearts();
            while (true) {
                tree.ctx.clearRect(0, 0, width, height);
                tree.jump();
                foot.draw();
                updateAndDrawHearts();
                $await(Jscex.Async.sleep(25));
            }
        }));

        var textAnimate = eval(Jscex.compile("async", function () {
            $("#code").show().typewriter();
        }));

        var runAsync = eval(Jscex.compile("async", function () {
            $await(seedAnimate());
            $await(growAnimate());
            $await(flowAnimate());
            $await(moveAnimate());
            
            textAnimate().start();
            $await(customJumpAnimate());
        }));

        runAsync().start();
    })();
    </script>
</body>
</html>
